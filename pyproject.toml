[project]
name = "chic-interiors-cloudflare"
version = "1.0.0"
description = "Chic Interiors Flask website deployed on Cloudflare Python Workers"
requires-python = ">=3.12"
dependencies = [
    "Flask==3.1.2",
    "python-dotenv==1.1.1",
]

[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk",
]
